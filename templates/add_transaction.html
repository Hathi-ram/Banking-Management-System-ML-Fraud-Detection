<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>➕ Add Transaction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {

            width: 600px;
            max-width: 90%;

            margin: 40px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0,0,0,.15);
        }

        h1 {

            text-align: center;

            color: #0d6efd;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 7px;

            box-sizing: border-box;
        }

        textarea {

            height: 100px;

            resize: vertical;
        }

        .buttons {

            margin-top: 25px;

            text-align: center;
        }

        button {

            padding: 12px 25px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            font-size: 16px;

            margin: 5px;
        }

        .save {

            background: #198754;
        }

        .back {

            background: #0d6efd;
        }

        button:hover {

            opacity: .9;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>➕ Add Transaction</h1>

    <form method="POST">

        <label>
            Account
        </label>

        <select name="account_id" required>

            <option value="">
                -- Select Account --
            </option>

            {% for account in accounts %}

            <option value="{{ account.account_id }}">

                {{ account.account_number }}
                -
                {{ account.customer_name }}

            </option>

            {% endfor %}

        </select>


        <label>
            Transaction Type
        </label>

        <select name="transaction_type" required>

            <option value="">
                -- Select Transaction Type --
            </option>

            <option value="Deposit">
                Deposit
            </option>

            <option value="Withdrawal">
                Withdrawal
            </option>

            <option value="Transfer">
                Transfer
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="NEFT">
                NEFT
            </option>

            <option value="RTGS">
                RTGS
            </option>

            <option value="IMPS">
                IMPS
            </option>

        </select>


        <label>
            Amount
        </label>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0"
            placeholder="Enter amount"
            required
        >


        <label>
            Transaction Status
        </label>

        <select name="transaction_status" required>

            <option value="Success">
                Success
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Failed">
                Failed
            </option>

        </select>


        <label>
            Remarks
        </label>

        <textarea
            name="remarks"
            placeholder="Enter remarks (optional)"
        ></textarea>


        <div class="buttons">

            <button
                type="submit"
                class="save">

                💾 Save Transaction

            </button>

            <a href="/transactions">

                <button
                    type="button"
                    class="back">

                    ↩ Back

                </button>

            </a>

        </div>

    </form>

</div>

</body>

</html>
