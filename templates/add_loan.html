<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Loan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>💵 Add New Loan</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <!-- Customer -->

                <div class="mb-3">

                    <label class="form-label">

                        Customer

                    </label>

                    <select
                        class="form-select"
                        name="customer_id"
                        required>

                        <option value="">Select Customer</option>

                        {% for customer in customers %}

                        <option value="{{ customer.customer_id }}">

                            {{ customer.customer_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Loan Type -->

                <div class="mb-3">

                    <label class="form-label">

                        Loan Type

                    </label>

                    <select
                        class="form-select"
                        name="loan_type"
                        required>

                        <option>Home</option>

                        <option>Car</option>

                        <option>Education</option>

                        <option>Personal</option>

                    </select>

                </div>

                <!-- Loan Amount -->

                <div class="mb-3">

                    <label class="form-label">

                        Loan Amount

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="loan_amount"
                        required>

                </div>

                <!-- Interest -->

                <div class="mb-3">

                    <label class="form-label">

                        Interest Rate (%)

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="interest_rate"
                        required>

                </div>

                <!-- Tenure -->

                <div class="mb-3">

                    <label class="form-label">

                        Loan Tenure (Months)

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="loan_tenure"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    💾 Save Loan

                </button>

                <a
                    href="/loans"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
