<!DOCTYPE html>
<html>

<head>

<title>Withdraw Money</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="card">

<h1>💸 Withdraw Money</h1>

{% if error %}
<h3 style="color:red;">
{{ error }}
</h3>
{% endif %}

<form method="POST">

<label>Account Number</label>

<br>

<input
type="text"
name="account_number"
required>

<br><br>

<label>Amount</label>

<br>

<input
type="number"
step="0.01"
name="amount"
required>

<br><br>

<button type="submit">

Withdraw

</button>

</form>

<br>

<a href="/accounts">

<button>

Back

</button>

</a>

</div>

</body>

</html>
