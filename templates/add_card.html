<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Issue New Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>💳 Issue New Card</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Account Number

                    </label>

                    <select
                        class="form-select"
                        name="account_id"
                        required>

                        <option value="">

                            Select Account

                        </option>

                        {% for account in accounts %}

                        <option value="{{ account.account_id }}">

                            {{ account.account_number }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Card Type

                    </label>

                    <select
                        class="form-select"
                        name="card_type"
                        required>

                        <option value="Debit">

                            Debit Card

                        </option>

                        <option value="Credit">

                            Credit Card

                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Issue Card

                </button>

                <a
                    href="/cards"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
