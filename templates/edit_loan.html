<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Loan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>✏ Edit Loan</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Loan Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ loan.loan_number }}"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Loan Type
                    </label>

                    <select
                        class="form-select"
                        name="loan_type">

                        <option value="Home"
                        {% if loan.loan_type=="Home" %}selected{% endif %}>
                        Home
                        </option>

                        <option value="Car"
                        {% if loan.loan_type=="Car" %}selected{% endif %}>
                        Car
                        </option>

                        <option value="Education"
                        {% if loan.loan_type=="Education" %}selected{% endif %}>
                        Education
                        </option>

                        <option value="Personal"
                        {% if loan.loan_type=="Personal" %}selected{% endif %}>
                        Personal
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Interest Rate (%)
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="interest_rate"
                        value="{{ loan.interest_rate }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Loan Status
                    </label>

                    <select
                        class="form-select"
                        name="loan_status">

                        <option value="Pending"
                        {% if loan.loan_status=="Pending" %}selected{% endif %}>
                        Pending
                        </option>

                        <option value="Approved"
                        {% if loan.loan_status=="Approved" %}selected{% endif %}>
                        Approved
                        </option>

                        <option value="Rejected"
                        {% if loan.loan_status=="Rejected" %}selected{% endif %}>
                        Rejected
                        </option>

                        <option value="Closed"
                        {% if loan.loan_status=="Closed" %}selected{% endif %}>
                        Closed
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Update Loan

                </button>

                <a
                    href="/loans"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
