<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>✏ Edit Card</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            color: #0d6efd;
        }

        .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        input[readonly] {
            background: #eee;
        }

        .buttons {
            margin-top: 25px;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-size: 16px;
            margin: 5px;
        }

        .save {
            background: #198754;
        }

        .back {
            background: #0d6efd;
        }

        button:hover {
            opacity: .9;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>✏ Edit Card</h1>

    {% if card %}

    <div class="info">

        <strong>Card Number:</strong>

        {{ card.card_number }}

        <br><br>

        <strong>Issue Date:</strong>

        {{ card.issue_date }}

        <br><br>

        <strong>Expiry Date:</strong>

        {{ card.expiry_date }}

    </div>

    <form method="POST">

        <label>
            Card Type
        </label>

        <select name="card_type" required>

            <option value="Debit"
                {% if card.card_type == "Debit" %}
                selected
                {% endif %}>
                Debit
            </option>

            <option value="Credit"
                {% if card.card_type == "Credit" %}
                selected
                {% endif %}>
                Credit
            </option>

        </select>


        <label>
            Card Status
        </label>

        <select name="card_status" required>

            <option value="Active"
                {% if card.card_status == "Active" %}
                selected
                {% endif %}>
                Active
            </option>

            <option value="Blocked"
                {% if card.card_status == "Blocked" %}
                selected
                {% endif %}>
                Blocked
            </option>

        </select>


        <div class="buttons">

            <button
                type="submit"
                class="save">

                💾 Update Card

            </button>

            <a href="/cards">

                <button
                    type="button"
                    class="back">

                    ↩ Back

                </button>

            </a>

        </div>

    </form>

    {% else %}

    <h3 style="color:red;text-align:center;">

        Card Not Found

    </h3>

    <div class="buttons">

        <a href="/cards">

            <button
                type="button"
                class="back">

                ↩ Back to Cards

            </button>

        </a>

    </div>

    {% endif %}

</div>

</body>

</html>
