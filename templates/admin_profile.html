<!DOCTYPE html>
<html>

<head>

    <title>Admin Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="card">

    <h1>👤 Admin Profile</h1>

    <br>

    {% if admin %}

    <table border="1" width="100%" cellpadding="10">

        <tr>

            <th width="30%">Field</th>

            <th>Value</th>

        </tr>

        <tr>

            <td>Admin ID</td>

            <td>{{ admin.admin_id }}</td>

        </tr>

        <tr>

            <td>Username</td>

            <td>{{ admin.username }}</td>

        </tr>

        <tr>

            <td>Full Name</td>

            <td>{{ admin.full_name }}</td>

        </tr>

        <tr>

            <td>Email</td>

            <td>{{ admin.email }}</td>

        </tr>

        <tr>

            <td>Phone</td>

            <td>{{ admin.phone }}</td>

        </tr>

    </table>

    {% else %}

    <h3 style="color:red;text-align:center;">

        ❌ No Admin Record Found

    </h3>

    {% endif %}

    <br>

    <!-- ============================= -->
    <!-- Edit Admin Profile -->
    <!-- ============================= -->

    <a href="/edit_admin">

        <button>

            ✏️ Edit Profile

        </button>

    </a>

    <br><br>

    <!-- ============================= -->
    <!-- Change Password -->
    <!-- ============================= -->

    <a href="/change_password">

        <button>

            🔐 Change Password

        </button>

    </a>

    <br><br>

    <!-- ============================= -->
    <!-- Dashboard -->
    <!-- ============================= -->

    <a href="/dashboard">

        <button>

            🏠 Dashboard

        </button>

    </a>

</div>

</body>

</html>
