```html
<!DOCTYPE html>
<html>

<head>

    <title>Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="card">

    <h1>🔐 Change Admin Password</h1>

    <br>

    {% if message %}

    <div style="
        background:#d4edda;
        color:#155724;
        padding:12px;
        border-radius:5px;
        margin-bottom:15px;
    ">

        ✅ {{ message }}

    </div>

    {% endif %}


    {% if error %}

    <div style="
        background:#f8d7da;
        color:#721c24;
        padding:12px;
        border-radius:5px;
        margin-bottom:15px;
    ">

        ❌ {{ error }}

    </div>

    {% endif %}


    <form method="POST"
          action="/change_password">

        <!-- Current Password -->

        <label>

            Current Password

        </label>

        <input
            type="password"
            name="current_password"
            placeholder="Enter current password"
            required
            style="
                width:100%;
                padding:10px;
                margin-top:8px;
                margin-bottom:15px;
            ">


        <!-- New Password -->

        <label>

            New Password

        </label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            required
            minlength="6"
            style="
                width:100%;
                padding:10px;
                margin-top:8px;
                margin-bottom:15px;
            ">


        <!-- Confirm Password -->

        <label>

            Confirm New Password

        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
            minlength="6"
            style="
                width:100%;
                padding:10px;
                margin-top:8px;
                margin-bottom:15px;
            ">


        <br>

        <button type="submit">

            🔐 Change Password

        </button>

    </form>


    <br>


    <a href="/admin">

        <button type="button">

            👤 Admin Profile

        </button>

    </a>


    <br><br>


    <a href="/dashboard">

        <button type="button">

            🏠 Dashboard

        </button>

    </a>

</div>

</body>

</html>
```
