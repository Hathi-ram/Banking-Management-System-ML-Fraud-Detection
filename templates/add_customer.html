<!DOCTYPE html>
<html>

<head>
    <title>Add Customer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="card">

<h1>➕ Add New Customer</h1>

<form method="POST">

<input type="text" name="first_name" placeholder="First Name" required>
<br><br>

<input type="text" name="last_name" placeholder="Last Name" required>
<br><br>

<select name="gender" required>
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select>
<br><br>

<input type="date" name="dob" required>
<br><br>

<input type="text" name="phone" placeholder="Phone" required>
<br><br>

<input type="email" name="email" placeholder="Email" required>
<br><br>

<input type="text" name="aadhaar_number" placeholder="Aadhaar Number" maxlength="12" required>
<br><br>

<input type="text" name="pan_number" placeholder="PAN Number" maxlength="10" required>
<br><br>

<input type="text" name="address" placeholder="Address">
<br><br>

<input type="text" name="city" placeholder="City">
<br><br>

<input type="text" name="state" placeholder="State">
<br><br>

<input type="text" name="pincode" placeholder="Pincode" maxlength="6">
<br><br>

<button type="submit">
Save Customer
</button>

</form>

<br>

<a href="/customers">
<button>Back</button>
</a>

</div>

</body>
</html>
