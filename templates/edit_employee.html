<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Employee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>✏ Edit Employee</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Designation

</label>

<input
type="text"
class="form-control"
name="designation"
value="{{ employee.designation }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Salary

</label>

<input
type="number"
class="form-control"
name="salary"
value="{{ employee.salary }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Phone

</label>

<input
type="text"
class="form-control"
name="phone"
value="{{ employee.phone }}">

</div>

<div class="mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
class="form-control"
name="email"
value="{{ employee.email }}">

</div>

<button
type="submit"
class="btn btn-success">

💾 Update Employee

</button>

<a href="/employees"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
